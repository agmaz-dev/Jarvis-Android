name: Android-APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: APK bauen
        shell: bash
        run: set -o pipefail; ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Build-Protokoll bei Fehler veröffentlichen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error:|FAILED|What went wrong|Exception|e: " build.log | head -300 > fehler.txt || true
          cp build.log build-protokoll.txt || true
          gh release delete build-log --yes --cleanup-tag || true
          sleep 3
          gh release create build-log fehler.txt build-protokoll.txt --target "$GITHUB_SHA" --title "Letztes fehlgeschlagenes Build-Protokoll" --notes "Commit ${GITHUB_SHA::7}" --prerelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis-Test.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Test
          path: Jarvis-Test.apk

      - name: Als Release mit direktem Download-Link veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk --yes --cleanup-tag || true
          gh release delete build-log --yes --cleanup-tag || true
          sleep 5
          gh release create test-apk Jarvis-Test.apk \
            --target "$GITHUB_SHA" \
            --title "Jarvis – Test-APK" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Debug-signiert, nur zum Testen." \
            --prerelease
          gh release edit test-apk --draft=false --prerelease

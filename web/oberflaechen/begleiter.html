<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Begleiter</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 6 von 7 · BEGLEITER */
  :root{--ac:#45d39a;--ac-rgb:69,211,154;--bg:#0a0c0f;--glass:rgba(16,20,24,.65)}
  #bg-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #bg-cap h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.04em}
  #bg-cap p{margin:4px 0 0;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div id="bg-cap"><h1 id="bgName">Jarvis</h1><p id="bgState">Hallo! Ich bin für dich da.</p></div>
<script src="/core/backend.js"></script>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  let cx = 0, cy = 0, R = 200, mx = 0, my = 0, lookX = 0, lookY = 0, blinkT = 3, blink = 0, sacc = 0, saccX = 0, saccY = 0, wob = 0;
  const BLOBS = [{ c: [40, 110, 255], r: 0.9, s: 0.31, p: 0 }, { c: [255, 110, 60], r: 0.8, s: 0.23, p: 2.1 }, { c: [30, 180, 110], r: 1.0, s: 0.19, p: 4.0 }, { c: [20, 200, 200], r: 0.6, s: 0.37, p: 1.2 }];
  addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; });
  J.registerTheme({
    id: "begleiter",
    init(J) {
      const nm = J.settings.name || "Jarvis"; $("bgName").textContent = nm; document.title = nm.toUpperCase() + " · Begleiter";
      J.on("state", s => { $("bgState").textContent = { idle: "Hallo! Ich bin für dich da.", listening: "Ich höre dir zu …", thinking: "Hmm, Moment …", speaking: "" }[s] || ""; });
      J.on("sentence", t => { $("bgState").textContent = t.length > 110 ? t.slice(0, 107) + " …" : t; });
      mx = innerWidth / 2; my = innerHeight / 2;
    },
    resize(w, h) { cx = w / 2; cy = h * 0.46; R = Math.min(w * 0.26, h * 0.3); },
    draw(ctx, w, h, S) {
      const t = S.t, dt = S.dt;
      wob += dt * (1 + S.speak * 2 + S.think * 1.5);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.fillStyle = "#0a0c0f"; ctx.fillRect(0, 0, w, h);
      const hal = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 2.2);
      hal.addColorStop(0, `rgba(60,200,150,${0.12 + S.level * 0.12})`); hal.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = hal; ctx.fillRect(0, 0, w, h);
      // Form mit sanftem Wabern
      const pts = [], bob = Math.sin(t * 1.6) * R * 0.02 - S.level * R * 0.03;
      for (let i = 0; i < 72; i++) {
        const a = i / 72 * TAU;
        const r = R * (1 + 0.018 * Math.sin(3 * a + wob) + 0.012 * Math.sin(5 * a - wob * 1.3) + S.level * 0.05 * Math.sin(4 * a - t * 9) + S.listen * 0.01 * Math.sin(2 * a + t * 3) + S.mic * 0.04 * Math.sin(6 * a + t * 10) + S.pulse * 0.03);
        pts.push(cx + Math.cos(a) * r, cy + bob + Math.sin(a) * r * (1 - S.level * 0.03));
      }
      const shape = () => { ctx.beginPath(); for (let i = 0; i < pts.length; i += 2) { const x = pts[i], y = pts[i + 1], nx = pts[(i + 2) % pts.length], ny = pts[(i + 3) % pts.length]; if (!i) ctx.moveTo((x + nx) / 2, (y + ny) / 2); else ctx.quadraticCurveTo(x, y, (x + nx) / 2, (y + ny) / 2); } const x = pts[0], y = pts[1]; ctx.quadraticCurveTo(x, y, (x + pts[2]) / 2, (y + pts[3]) / 2); ctx.closePath(); };
      ctx.save(); shape(); ctx.clip();
      ctx.fillStyle = "#0f3a2a"; ctx.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6);
      BLOBS.forEach((b, i) => {
        const sp = b.s * (1 + S.speak * 1.2 + S.think * 0.8);
        const bx = cx + Math.cos(t * sp + b.p) * R * 0.55, by = cy + Math.sin(t * sp * 1.3 + b.p) * R * 0.5;
        const g = ctx.createRadialGradient(bx, by, 0, bx, by, R * b.r * (1 + S.level * 0.15));
        g.addColorStop(0, `rgba(${b.c},0.95)`); g.addColorStop(1, `rgba(${b.c},0)`);
        ctx.fillStyle = g; ctx.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6);
      });
      const sh = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.2, cx, cy, R * 1.05);
      sh.addColorStop(0, "rgba(255,255,255,0.10)"); sh.addColorStop(0.7, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,0.45)");
      ctx.fillStyle = sh; ctx.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6);
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 1.5; shape(); ctx.stroke();
      // Augen
      blinkT -= dt; if (blinkT <= 0) { blink = 0.16; blinkT = 2.5 + Math.random() * 4; }
      blink = Math.max(0, blink - dt);
      sacc -= dt; if (sacc <= 0) { sacc = 1.2 + Math.random() * 2.5; saccX = (Math.random() - .5) * 0.6; saccY = (Math.random() - .5) * 0.4; }
      let tx = Math.max(-1, Math.min(1, (mx - cx) / (w * 0.4))), ty = Math.max(-1, Math.min(1, (my - cy) / (h * 0.4)));
      tx = tx * 0.7 + saccX * 0.3; ty = ty * 0.7 + saccY * 0.3;
      if (J.state === "thinking") { tx = Math.sin(t * 1.8) * 0.8; ty = -0.6; }
      if (J.state === "listening") { tx *= 0.3; ty *= 0.3; }
      lookX += (tx - lookX) * Math.min(1, dt * 8); lookY += (ty - lookY) * Math.min(1, dt * 8);
      const ew = R * 0.085, eh0 = R * 0.21 * (J.state === "listening" ? 1.12 : J.state === "thinking" ? 0.75 : 1);
      const eh = eh0 * (blink > 0 ? 0.12 : 1) * (1 + S.level * 0.22 * Math.sin(t * 14));
      const ex = cx + lookX * R * 0.22, ey = cy + bob + lookY * R * 0.16 - R * 0.05;
      ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(255,255,255,0.6)"; ctx.shadowBlur = 14;
      [-1, 1].forEach(sd => { const x = ex + sd * R * 0.19; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - ew / 2, ey - eh / 2, ew, eh, ew / 2) : ctx.rect(x - ew / 2, ey - eh / 2, ew, eh); ctx.fill(); });
      // Mund beim Sprechen
      const mo = S.level * S.speak;
      if (mo > 0.04) {
        const mw = R * (0.12 + mo * 0.08), mh = R * 0.12 * mo;
        ctx.beginPath(); ctx.ellipse(ex, ey + R * 0.27, mw, Math.max(1.5, mh), 0, 0, TAU); ctx.fill();
      }
      ctx.shadowBlur = 0;
      // Zuhör-Wellen
      if (S.listen > 0.3) { ctx.strokeStyle = `rgba(120,255,200,${(S.listen - 0.3) * 0.5 + S.mic * 0.5})`; ctx.lineWidth = 2; for (let k = 0; k < 3; k++) { const rr = R * (1.08 + ((t * 0.5 + k / 3) % 1) * 0.35); ctx.globalAlpha = 1 - ((t * 0.5 + k / 3) % 1); ctx.beginPath(); ctx.arc(cx, cy + bob, rr, 0, TAU); ctx.stroke(); } ctx.globalAlpha = 1; }
      // Schatten
      ctx.save(); ctx.translate(cx, cy + R * 1.2); ctx.scale(1, 0.1);
      const sd = ctx.createRadialGradient(0, 0, 0, 0, 0, R); sd.addColorStop(0, "rgba(60,200,150,0.25)"); sd.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = sd; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill(); ctx.restore();
    }
  });
})();
</script>
</body>
</html>

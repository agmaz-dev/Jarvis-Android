<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Nova</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 2 von 7 · NOVA */
  :root{--ac:#ff8a1f;--ac-rgb:255,138,31;--bg:#080402;--glass:rgba(22,12,6,.62)}
  #nv-hero{position:fixed;left:6vw;top:22vh;z-index:5;max-width:min(560px,44vw);pointer-events:none}
  #nv-hero .k{font-size:11px;letter-spacing:.3em;color:var(--ac);display:flex;align-items:center;gap:8px;margin-bottom:14px}
  #nv-hero .k i{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:jvBlink 1.4s steps(1) infinite}
  #nv-hero h1{margin:0;font-family:"Bahnschrift SemiBold Condensed","Bahnschrift","Arial Narrow","Arial Black",Impact,sans-serif;font-weight:800;
    font-size:clamp(40px,6.4vw,104px);line-height:.92;letter-spacing:.01em;color:#fff;text-transform:uppercase;text-shadow:0 0 40px rgba(255,138,31,.25)}
  #nv-sub{margin:16px 0 0;font-size:clamp(16px,1.5vw,22px);color:var(--ac);font-weight:500;min-height:2.6em;line-height:1.3;transition:opacity .3s}
  #nv-cards{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:8px;margin-top:34px;max-width:420px}
  .nv-c{border:1px solid rgba(255,255,255,.08);background:rgba(25,14,8,.55);border-radius:6px;padding:9px 12px;transition:border-color .4s,background .4s,box-shadow .4s}
  .nv-c b{display:block;font-family:"Bahnschrift","Arial Narrow",sans-serif;font-size:13px;letter-spacing:.12em;color:#fff}
  .nv-c span{font-size:11px;color:var(--mut)}
  .nv-c small{float:right;font-size:9px;letter-spacing:.14em;color:rgba(255,138,31,.6)}
  .nv-c.on{border-color:var(--ac);background:rgba(255,138,31,.14);box-shadow:0 0 22px rgba(255,138,31,.25)}
  @media (max-width:900px){#nv-hero{left:20px;top:64px;max-width:calc(100vw - 40px)}#nv-cards{display:none}#nv-hero h1{font-size:40px}}
</style>
</head>
<body>
<div id="nv-hero">
  <div class="k"><i></i><span id="nvK">AGENT · ONLINE</span></div>
  <h1 id="nvH">Ich bin Jarvis.</h1>
  <p id="nv-sub">Nicht irgendeine KI.</p>
  <div id="nv-cards">
    <div class="nv-c" data-m="gedaechtnis"><small>01</small><b>GEDÄCHTNIS</b><span>merkt sich, was zählt</span></div>
    <div class="nv-c" data-m="stimme"><small>02</small><b>STIMME</b><span>spricht und hört zu</span></div>
    <div class="nv-c" data-m="automation"><small>03</small><b>AUTOMATION</b><span>Timer, Routinen, Webseiten</span></div>
    <div class="nv-c" data-m="suche"><small>04</small><b>WEBSUCHE</b><span>sucht aktuelle Infos</span></div>
    <div class="nv-c" data-m="wetter"><small>05</small><b>WETTER</b><span>live für deinen Ort</span></div>
    <div class="nv-c" data-m="system"><small>06</small><b>SYSTEM</b><span>CPU, RAM, Festplatte</span></div>
  </div>
</div>
<script src="/core/backend.js"></script>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  let P = [], cx = 0, cy = 0, R = 200, rings = [], prevLv = 0, ringCd = 0, idleSub = "Nicht irgendeine KI.";
  function build() {
    P = [];
    for (let i = 0; i < 2600; i++) {
      const rr = 0.06 + 0.94 * Math.pow(Math.random(), 1.35);
      const arm = (i % 3) * TAU / 3;
      P.push({ rr, a: Math.random() * TAU, arm, b: (Math.random() - 0.5) * Math.PI * (0.3 + 0.7 * rr) * (Math.random() < 0.55 ? 0.35 : 1), w: 0.35 / Math.sqrt(rr + 0.08) * (Math.random() < 0.1 ? -0.6 : 1),
        hot: Math.random(), sz: Math.random() });
    }
  }
  const sub = t => { const e = $("nv-sub"); if (e.textContent !== t) e.textContent = t; };
  J.registerTheme({
    id: "nova",
    init(J) {
      build();
      const nm = J.settings.name || "Jarvis";
      $("nvH").textContent = "Ich bin " + nm + "."; document.title = nm.toUpperCase() + " · Nova";
      J.on("state", s => {
        $("nvK").textContent = { idle: "AGENT · ONLINE", listening: "HÖRT ZU", thinking: "DENKT NACH", speaking: "SPRICHT" }[s];
        if (s === "idle") sub(idleSub); else if (s === "listening") sub("Ich höre zu …"); else if (s === "thinking") sub("Einen Moment …");
      });
      J.on("sentence", t => sub(t.length > 140 ? t.slice(0, 137) + " …" : t));
      J.on("module", m => { const c = document.querySelector(`.nv-c[data-m="${m}"]`); if (c) { c.classList.add("on"); clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove("on"), m === "stimme" ? 1500 : 3500); } });
    },
    resize(w, h) {
      if (w < 900) { cx = w / 2; cy = h * 0.5; R = Math.min(w, h) * 0.3; }
      else { cx = w * 0.69; cy = h * 0.46; R = Math.min(w * 0.24, h * 0.36); }
    },
    draw(ctx, w, h, S) {
      const t = S.t, dt = S.dt;
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.8);
      bg.addColorStop(0, "#2a1407"); bg.addColorStop(0.35, "#120804"); bg.addColorStop(1, "#050201");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(255,140,60,0.035)"; ctx.lineWidth = 1; ctx.beginPath();
      for (let y = 0; y < h; y += 46) { ctx.moveTo(0, y); ctx.lineTo(w, y); } ctx.stroke();

      ctx.globalCompositeOperation = "lighter";
      const spin = 1 + S.think * 2.2 + S.speak * 0.5, expand = 1 + S.level * 0.28 + S.pulse * 0.12 - S.think * 0.06;
      const tilt = 0.42, ct = Math.cos(tilt), st = Math.sin(tilt);
      const buckets = [[], [], []];
      for (const p of P) {
        p.a += p.w * dt * spin;
        const r = p.rr * R * expand * (1 + 0.04 * Math.sin(t * 2 + p.rr * 9));
        const a = p.a + p.arm + p.rr * 3.2;
        const lat = p.b;
        const x = r * Math.cos(lat) * Math.cos(a), z0 = r * Math.cos(lat) * Math.sin(a), y0 = r * Math.sin(lat) * 0.95;
        const y = y0 * ct - z0 * st, z = y0 * st + z0 * ct;
        const a2 = a - p.w * 0.16 * spin * (1 + S.level);
        const x2 = r * Math.cos(lat) * Math.cos(a2), z2 = r * Math.cos(lat) * Math.sin(a2);
        const yb = y0 * ct - z2 * st;
        const d = 0.5 + 0.5 * (z / (R * expand + 1));
        buckets[d > 0.66 ? 2 : d > 0.4 ? 1 : 0].push(cx + x, cy + y, cx + x2, cy + yb);
      }
      const cols = ["rgba(255,120,40,0.22)", "rgba(255,160,70,0.42)", "rgba(255,210,140,0.7)"];
      buckets.forEach((b, i) => {
        ctx.strokeStyle = cols[i]; ctx.lineWidth = 0.6 + i * 0.35; ctx.globalAlpha = 0.8 + S.level * 0.2; ctx.beginPath();
        for (let k = 0; k < b.length; k += 4) { ctx.moveTo(b[k], b[k + 1]); ctx.lineTo(b[k + 2], b[k + 3]); }
        ctx.stroke();
      });
      const sp = J.sprite;
      // Funken
      for (let i = 0; i < 90; i++) {
        const p = P[i * 23];
        const r = p.rr * R * expand, a = p.a + p.arm + p.rr * 3.2;
        J.glowAt(ctx, sp(255, 200, 120, true), cx + r * Math.cos(a), cy + r * Math.sin(a) * 0.45, 6 + p.sz * 8, 0.5 + 0.5 * Math.sin(t * 3 + i));
      }
      // Kern und Lichtstreif
      const core = R * (0.42 + S.level * 0.55 + S.pulse * 0.2);
      J.glowAt(ctx, sp(255, 120, 30), cx, cy, R * (2.4 + S.level * 0.8), 0.28 + S.level * 0.25);
      J.glowAt(ctx, sp(255, 190, 90), cx, cy, core * 1.6, 0.6 + S.level * 0.3);
      J.glowAt(ctx, sp(255, 250, 230, true), cx, cy, core * 0.55, 0.9);
      ctx.save(); ctx.translate(cx, cy); ctx.scale(9 + S.level * 6, 0.12 + S.level * 0.05);
      J.glowAt(ctx, sp(255, 210, 150), 0, 0, R * 0.55, 0.55 + S.level * 0.4); ctx.restore();
      ctx.save(); ctx.translate(cx, cy); ctx.scale(0.06, 3.2 + S.level * 2);
      J.glowAt(ctx, sp(255, 210, 150), 0, 0, R * 0.4, 0.25 + S.level * 0.3); ctx.restore();
      if (S.listen > 0.3) J.glowAt(ctx, sp(255, 230, 160), cx, cy, R * (1.1 + S.mic * 0.8), (S.listen - 0.3) * 0.25 + S.mic * 0.3);
      // Druckwellen beim Sprechen
      ringCd -= dt;
      if (S.level - prevLv > 0.07 && S.level > 0.35 && ringCd <= 0) { rings.push({ r: R * 0.25, a: 0.55 }); ringCd = 0.18; }
      prevLv = S.level;
      ctx.globalAlpha = 1;
      rings = rings.filter(g => (g.a -= dt * 0.7) > 0);
      rings.forEach(g => { g.r += R * 1.3 * dt; ctx.strokeStyle = `rgba(255,170,80,${g.a})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy, g.r, g.r * 0.92, 0, 0, TAU); ctx.stroke(); });
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
